name: CI

on:
  push:
  workflow_dispatch:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src/ scripts/ tests/
      - run: ruff format --check src/ scripts/ tests/
      - run: pytest

  deploiement:
    needs: qualite
    # Une branche de travail poussee sur GitHub passe les tests mais ne deploie pas.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pousser vers le Space Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force \
            https://lapauze:$HF_TOKEN@huggingface.co/spaces/lapauze/P5 \
            HEAD:main
