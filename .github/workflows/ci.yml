name: CI

on:
  push:
    # Un tag pointe sur un commit deja teste : sans ce filtre, `git push
    # --follow-tags` lance deux fois la meme CI.
    tags-ignore: ['**']
  workflow_dispatch:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src/ scripts/ tests/
      - run: ruff format --check src/ scripts/ tests/
      - run: pytest --cov-report=html
      - uses: actions/upload-artifact@v4
        # always() : un rapport de couverture sert surtout quand un test casse.
        if: always()
        with:
          name: couverture
          path: htmlcov/

